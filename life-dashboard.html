<!DOCTYPE html>
<html lang="fr">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: https://azure.assets.harvey.ai; connect-src 'none'; webrtc 'block'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#131526;--bg-card:#1E1F35;--bg-card-hover:#262840;--bg-input:#16172B;
  --accent:#C8956C;--accent-hover:#D4A57E;--accent-dim:rgba(200,149,108,.15);
  --text:#A0A0B8;--text-bright:#E8E8F0;--text-muted:#6B6B80;
  --border:#2A2B42;--border-light:#353650;
  --red:#E06070;--green:#60C090;--blue:#7B8CDE;
  --amber:#F5A623;--orange:#FF8F00;--yellow:#FFD600;
  --radius:12px;--radius-sm:8px;--radius-pill:999px;
  --transition:all .25s cubic-bezier(.4,0,.2,1);
}
html{font-size:15px}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.topnav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);flex-wrap:wrap;gap:10px}
.topnav-brand{display:flex;align-items:center;gap:10px}
.topnav-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#E8A87C);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff}
.topnav-title{font-size:17px;font-weight:600;color:var(--text-bright);letter-spacing:-.3px}
.topnav-tabs{display:flex;gap:0;flex-wrap:wrap}
.topnav-tab{padding:8px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:color .15s ease,border-color .15s ease;border:none;background:transparent;color:#5a6b80;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:5px}
.topnav-tab.active{color:#e0e0e0;border-bottom-color:var(--amber)}
.topnav-tab:not(.active):hover{color:rgba(255,255,255,.7)}
.topnav-tab .tab-icon{font-size:13px}
.topnav-gear{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:6px;border-radius:6px;transition:var(--transition);display:none;align-items:center}
.topnav-gear:hover{color:var(--text-bright);background:var(--bg-card-hover)}

.main-container{max-width:min(1400px,92vw);margin:0 auto;padding:24px 16px 60px}
.section-title{font-size:18px;font-weight:600;color:var(--text-bright);margin-bottom:16px;letter-spacing:-.3px}
.section-subtitle{font-size:12px;color:var(--text-muted);margin-top:3px;font-weight:400}
.tab-page{display:none;animation:fadeIn .3s ease}.tab-page.active{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;transition:var(--transition)}

.pill-tabs{display:flex;gap:3px;background:var(--bg-input);padding:3px;border-radius:var(--radius-pill);margin-bottom:16px;width:fit-content;flex-wrap:wrap}
.pill-tab{padding:7px 18px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:500;cursor:pointer;transition:var(--transition);border:none;background:transparent;color:var(--text-muted)}
.pill-tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(200,149,108,.25)}
.pill-tab:not(.active):hover{color:var(--text);background:var(--bg-card-hover)}

.item-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;transition:var(--transition);animation:slideIn .25s ease;flex-wrap:wrap}
.item-row:hover{border-color:var(--border-light);background:var(--bg-card-hover)}
.drag-handle{display:flex;flex-direction:column;gap:2px;cursor:grab;padding:3px 6px 3px 3px;opacity:.35;transition:opacity .2s;user-select:none}
.drag-handle:hover{opacity:.7}
.drag-handle:active{cursor:grabbing}
.drag-handle span{display:flex;gap:3px}
.drag-handle span i{width:3px;height:3px;background:var(--text-muted);border-radius:50%;display:block}
.item-row.dragging{opacity:.4;background:rgba(120,140,222,.1);border:1px dashed var(--accent)!important}
.item-row.drag-over{border-top:2px solid var(--accent)!important}
.sort-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px;margin-left:8px}
.sort-btn:hover{color:var(--text-bright);border-color:var(--accent);background:rgba(120,140,222,.1)}

.item-label,.ed-input{flex:1;font-size:13px;color:var(--text-bright);background:transparent;border:none;outline:none;font-family:inherit;min-width:80px}
.item-label::placeholder,.ed-input::placeholder{color:var(--text-muted)}
.item-label:focus,.ed-input:focus{color:#fff}
.item-amount,.ed-amount{width:100px;text-align:right;font-size:14px;font-weight:600;color:var(--text-bright);background:transparent;border:none;outline:none;font-family:inherit;font-variant-numeric:tabular-nums}
.item-amount:focus,.ed-amount:focus{color:#fff}
.item-amount::placeholder,.ed-amount::placeholder{color:var(--text-muted)}
.item-currency{font-size:12px;color:var(--text-muted);margin-left:2px}
.ed-select{background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11.5px;padding:4px 6px;font-family:inherit;outline:none;cursor:pointer;max-width:150px}
.ed-select:focus{border-color:var(--accent)}
.ed-date{background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11.5px;padding:4px 6px;font-family:inherit;outline:none;width:130px}
.ed-date:focus{border-color:var(--accent)}
.ed-small{width:70px;text-align:right;font-size:13px;font-weight:500;color:var(--text-bright);background:transparent;border:none;outline:none;font-family:inherit}

.item-delete{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:5px;border-radius:6px;transition:var(--transition);display:flex;align-items:center;justify-content:center}
.item-delete:hover{color:var(--red);background:rgba(224,96,112,.1)}
.item-delete svg{width:15px;height:15px}
.add-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--radius-pill);background:var(--accent-dim);color:var(--accent);border:1px dashed rgba(200,149,108,.3);cursor:pointer;font-size:12.5px;font-weight:500;font-family:inherit;transition:var(--transition);margin-top:4px}
.add-btn:hover{background:rgba(200,149,108,.25);border-color:var(--accent)}
.add-btn svg{width:15px;height:15px}

.summary-text{font-size:13px;line-height:1.7;color:var(--text);padding:14px 18px;background:var(--bg-input);border-radius:var(--radius-sm);border:1px solid var(--border);margin-top:16px}
.summary-text strong{color:var(--text-bright);font-weight:600}
.summary-text .highlight{color:var(--accent);font-weight:600}

.sankey-container{position:relative;margin-top:20px;overflow:visible;width:100%}
.sankey-container svg{width:100%;display:block}
.sankey-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;color:var(--text-muted);text-align:center}
.sankey-empty svg{width:44px;height:44px;margin-bottom:14px;opacity:.3}
.sankey-empty p{font-size:13px;line-height:1.6}

.gauge-wrapper{display:flex;flex-direction:column;align-items:center;padding:16px}
.gauge-svg{width:200px;height:120px}
.gauge-value{font-size:32px;font-weight:700;color:var(--text-bright);margin-top:6px;font-variant-numeric:tabular-nums}
.gauge-label{font-size:12px;color:var(--text-muted);margin-top:3px}
.gauge-sublabel{font-size:11px;color:var(--text-muted);margin-top:10px;display:flex;align-items:center;gap:5px}
.gauge-sublabel .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

.summary-table{width:100%;border-collapse:separate;border-spacing:0}
.summary-table th{text-align:left;font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;padding:9px 14px;border-bottom:1px solid var(--border)}
.summary-table td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border)}
.summary-table tr:last-child td{border-bottom:none;font-weight:600;color:var(--text-bright)}
.summary-table .label{color:var(--text)}
.summary-table .value{text-align:right;font-weight:600;color:var(--text-bright);font-variant-numeric:tabular-nums}
.summary-table .positive{color:var(--green)}.summary-table .negative{color:var(--red)}.summary-table .accent-val{color:var(--accent)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px}
@media(max-width:1000px){.grid-4{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

.kpi{text-align:center;padding:18px 14px}
.kpi-value{font-size:28px;font-weight:700;color:var(--text-bright);font-variant-numeric:tabular-nums}
.kpi-value.gold{color:var(--accent)}
.kpi-value.green{color:var(--green)}
.kpi-value.red{color:var(--red)}
.kpi-label{font-size:11.5px;color:var(--text-muted);margin-top:4px}

.progress-wrap{width:100%;height:8px;background:var(--bg-input);border-radius:4px;overflow:hidden;margin:8px 0}
.progress-bar{height:100%;border-radius:4px;transition:width .4s ease;background:var(--accent)}
.progress-bar.green{background:var(--green)}

.expand-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;font-family:inherit;padding:4px 0;transition:var(--transition)}
.expand-btn:hover{color:var(--accent-hover)}
.amort-table{width:100%;font-size:11.5px;margin-top:10px;border-collapse:collapse}
.amort-table th{text-align:left;color:var(--text-muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border);font-size:10.5px;text-transform:uppercase}
.amort-table td{padding:5px 8px;color:var(--text);border-bottom:1px solid rgba(42,43,66,.5);font-variant-numeric:tabular-nums}

.ms-wrap{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.ms-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--radius-pill);background:var(--accent-dim);color:var(--accent);font-size:11px;font-weight:500}
.ms-tag button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;line-height:1;padding:0 2px}

.donut-wrap{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;padding:10px 0}
.donut-legend{display:flex;flex-direction:column;gap:8px}
.donut-legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text)}
.donut-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.hero-net{text-align:center;padding:28px 20px}
.hero-net-value{font-size:42px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.hero-net-label{font-size:13px;color:var(--text-muted);margin-top:6px}

.cat-select{background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11.5px;padding:4px 6px;font-family:inherit;outline:none;cursor:pointer;max-width:140px}
.cat-select:focus{border-color:var(--accent)}

.field-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.field-label{font-size:11px;color:var(--text-muted);white-space:nowrap}

.badge-plafond{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-pill);font-size:10.5px;font-weight:600;margin-left:6px}
.badge-plafond.warning{background:rgba(245,166,35,.15);color:var(--amber)}
.badge-plafond.ok{background:rgba(96,192,144,.1);color:var(--green)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.modal-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:440px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-title{font-size:17px;font-weight:600;color:var(--text-bright);margin-bottom:18px}
.modal-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:var(--transition);border:1px solid var(--border);background:var(--bg-input);color:var(--text-bright);width:100%;margin-bottom:10px}
.modal-btn:hover{background:var(--bg-card-hover);border-color:var(--border-light)}
.modal-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-btn.primary:hover{background:var(--accent-hover)}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;padding:4px}
.modal-close:hover{color:var(--text-bright)}

.time-selector{display:flex;gap:4px;background:var(--bg-input);padding:3px;border-radius:var(--radius-pill)}
.time-btn{padding:5px 12px;border-radius:var(--radius-pill);font-size:10px;font-weight:600;cursor:pointer;transition:var(--transition);border:none;background:transparent;color:#5a6b80}
.time-btn.active{background:rgba(255,171,0,.15);color:var(--amber)}
.time-btn:hover:not(.active){color:var(--text)}

.toggle-btn{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-family:inherit;transition:var(--transition)}
.toggle-btn:hover{border-color:var(--accent);color:var(--accent)}

.fiscal-panel{display:none;margin-top:8px;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11.5px;color:var(--text);line-height:1.6}
.fiscal-panel.open{display:block}
.fiscal-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-pill);font-size:10px;font-weight:600}
.fiscal-badge.locked{background:rgba(255,143,0,.15);color:var(--orange)}
.fiscal-badge.unlocked{background:rgba(96,192,144,.1);color:var(--green)}

.completion-pct{font-size:12px;font-weight:700;color:var(--text-bright);white-space:nowrap}
.completion-pct.over{color:var(--amber)}

.pea-slider-wrap{display:flex;align-items:center;gap:10px;flex:0 0 50%;max-width:55%}
.pea-slider{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;background:linear-gradient(to right,#C8956C var(--filled,50%),#2a2a4a var(--filled,50%));outline:none;cursor:grab;pointer-events:auto;position:relative;z-index:2;accent-color:#C8956C;transition:background .15s}
.pea-slider:active{cursor:grabbing}
.pea-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#C8956C;cursor:grab;pointer-events:auto;border:2px solid #1a1a2e;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .1s;margin-top:-7px}
.pea-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#C8956C;cursor:grab;pointer-events:auto;border:2px solid #1a1a2e;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pea-slider::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.15)}
.pea-slider::-moz-range-thumb:active{cursor:grabbing}
.pea-slider::-webkit-slider-runnable-track{height:6px;border-radius:3px}
.pea-slider::-moz-range-track{height:6px;border-radius:3px;background:#2a2a4a}
.pea-slider::-moz-range-progress{height:6px;border-radius:3px;background:#C8956C}
.pea-slider-label{font-size:11px;font-family:'SF Mono',Monaco,Consolas,monospace;font-weight:600;color:#d0d8e4;white-space:nowrap;min-width:55px;text-align:right;pointer-events:none}


.slider-label strong{color:var(--text-bright)}


.sk-flow{cursor:pointer;transition:opacity .15s ease}

/* Opérations programmées */
.ops-section{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
.ops-toggle{background:none;border:1px solid var(--border);color:var(--text-muted);font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:4px}
.ops-toggle:hover{border-color:var(--accent);color:var(--text)}
.ops-list{margin-top:8px}
.op-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.op-row .field-group{margin:0}
.op-fiscal-box{margin:4px 0 4px 10px;padding:6px 10px;border-radius:6px;font-size:11px;border:1px solid rgba(200,149,108,0.2)}
.op-fiscal-box.ok{background:rgba(46,184,92,0.08);border-color:rgba(46,184,92,0.3);color:#6fcf97}
.op-fiscal-box.warn{background:rgba(255,193,7,0.08);border-color:rgba(255,193,7,0.3);color:#ffc107}
/* Donut chart */
.donut-container{display:flex;justify-content:center;align-items:center;gap:30px;flex-wrap:wrap;padding:20px}
.donut-legend{display:flex;flex-direction:column;gap:6px;font-size:12px}
.donut-legend-item{display:flex;align-items:center;gap:8px}
.donut-legend-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
/* Multi-line chart */
.chart-line-legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:11px;flex-wrap:wrap}
.chart-line-legend span{display:flex;align-items:center;gap:5px}

.passive-check{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);cursor:pointer;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);transition:all .15s}
.passive-check:has(input:checked){border-color:rgba(200,149,108,.5);background:rgba(200,149,108,.08);color:var(--text-bright)}
.passive-check input[type="checkbox"]{-webkit-appearance:none;appearance:none;width:16px;height:16px;border:2px solid var(--border);border-radius:4px;background:transparent;cursor:pointer;position:relative;flex-shrink:0;transition:all .15s}
.passive-check input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent)}
.passive-check input[type="checkbox"]:checked::after{content:'\2713';position:absolute;top:-1px;left:2px;font-size:11px;font-weight:700;color:#1a1a2e}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-brand">
    <div class="topnav-logo">L</div>
    <span class="topnav-title">Life Dashboard</span>
  </div>
  <div class="topnav-tabs" id="nav-tabs"></div>
  <button class="topnav-gear" id="gear-btn" title="Paramètres">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
  </button>
</nav>

<div class="main-container">
  <div id="page-budget" class="tab-page active"></div>
  <div id="page-epargne" class="tab-page"></div>
  <div id="page-investissements" class="tab-page"></div>
  <div id="page-objectifs" class="tab-page"></div>
  <div id="page-emprunts" class="tab-page"></div>
  <div id="page-patrimoine" class="tab-page"></div>
  <div id="page-reglages" class="tab-page"></div>
  <div id="page-scenarios" class="tab-page"></div>
</div>

function getProjectedMonthlySalary(targetDate){
var td=targetDate instanceof Date?targetDate:new Date(targetDate);
var now=new Date();var nowMonth=now.getFullYear()*12+now.getMonth();
var tdMonth=td.getFullYear()*12+td.getMonth();
var monthsElapsed=tdMonth-nowMonth;
if(monthsElapsed<=0)return getMonthlySalary();
var bData;
try{var raw=localStorage.getItem('life-dashboard-budget');if(raw)bData=JSON.parse(raw)}catch(e){}
if(!bData)bData=budgetState;
var total=0;
(bData.revenus||[]).forEach(function(item){
if((item.revCategorie||'Salaire')!=='Salaire')return;
var base=pf(item.amount);if(base<=0)return;
var gr=pf(item.growthRate)||0;
var geStr=item.growthEnd||'';
var geMonth=geStr?new Date(geStr+'-01').getFullYear()*12+new Date(geStr+'-01').getMonth():Infinity;
var evts=(item.salaryEvents||[]).slice().sort(function(a,b){
var da=a.date?new Date(a.date+'-01').getTime():0;
var db=b.date?new Date(b.date+'-01').getTime():0;
return da-db;
});
var projected=base;
if(gr!==0){
var growthMonths=Math.min(monthsElapsed,isFinite(geMonth)?Math.max(geMonth-nowMonth,0):monthsElapsed);
if(growthMonths>0){
projected=projected*Math.pow(1+gr/100,growthMonths/12);
}
}
evts.forEach(function(ev){
if(!ev.date||!ev.pct)return;
var evMonth=new Date(ev.date+'-01').getFullYear()*12+new Date(ev.date+'-01').getMonth();
if(evMonth>nowMonth&&evMonth<=tdMonth){
projected=projected*(1+pf(ev.pct)/100);
}
});
total+=projected;
});
return total;
}

function budgetTotals(){

  return{rev:rev,inv:inv,dep:dep,reste:reste,tauxEpargne:tauxEpargne,tauxPossible:tauxPossible};

function getImmoProjectionData(p,y){var now=new Date(),cy=now.getFullYear(),ty=cy+y,pp=pf(p.purchasePrice);if(pp<=0)return{capitalInvesti:0,gains:0,totalValue:0,loanRemaining:0};var py=p.purchaseDate?new Date(p.purchaseDate).getFullYear():cy;if(ty<py)return{capitalInvesti:0,gains:0,totalValue:0,loanRemaining:0};var ysp=ty-py,appr=pf(p.appreciation||2)/100,tv=pp*Math.pow(1+appr,ysp),g=tv-pp,ap=pf(p.apport||0)||(p.apportSources||[]).reduce(function(t,x){return t+(pf(x.amount)||0)},0),ci=ap,lr=0;if(p.loanId){var loan=empruntsState.find(function(l){return l.id===p.loanId});if(loan){var sc=computeAmortSchedule(loan),lc=pf(loan.capital),ls=loan.startDate?new Date(loan.startDate):(p.purchaseDate?new Date(p.purchaseDate):now),lsy=ls.getFullYear(),lsm=ls.getMonth(),me=Math.max(0,(ty-lsy)*12+(12-lsm));me=Math.min(me,sc.schedule.length);var cr=0;for(var m=0;m<me;m++)cr+=sc.schedule[m].capital;ci=Math.max(ap,Math.max(pp-lc,0))+cr;if(me>=sc.schedule.length)lr=0;else if(me>0)lr=sc.schedule[me-1].balance;else lr=lc}}else{ci=pp}return{capitalInvesti:ci,gains:g,totalValue:tv,loanRemaining:lr}}

investState.financier.forEach(function(a){

var invested=bal-gEur;if(invested>0){wR+=invested*(gEur/invested*100)}
});
var totCap=cap>0?cap:1;wR=wR/totCap;
wER=weightedExpectedReturn();
}

function objFunded(obj){var total=pf(obj.manualAmount);(obj.linkedAccounts||[]).forEach(function(la){var acc=getAllAccounts().find(function(a){return a.id===la.accountId});if(!acc)return;if(la.mode==='pct')total+=pf(acc.balance)*pf(la.value)/100;else total+=pf(la.value)});return total}
function getMonthlyExpenses(){var fromMem=(budgetState.depenses||[]).reduce(function(s,i){return s+pf(i.amount)},0);if(fromMem>0)return fromMem;try{var val=localStorage.getItem(SK_MONTHLY_EXP);return parseFloat(val)||0}catch(e){return 0}}
function objTarget(obj){if(obj.isMatelas&&pf(obj.moisMatelas)>0){return getMonthlyExpenses()*pf(obj.moisMatelas)}return pf(obj.target)}
function predictObjectiveDate(obj){
var target=objTarget(obj),current=objFunded(obj);
if(target<=0)return{status:'none'};
if(current>=target)return{status:'reached',label:'Atteint ✅'};
var remaining=target-current;
var monthlyGrowth=0;
(obj.linkedAccounts||[]).forEach(function(la){
var acc=getAllAccounts().find(function(a){return a.id===la.accountId});
if(!acc)return;
var bal=pf(acc.balance);
var mc=pf(acc.monthlyContrib||0);
var er=pf(acc.expectedReturn||acc.rate||0)/100/12;
var fraction=la.mode==='pct'?pf(la.value)/100:1;
monthlyGrowth+=(bal*er+mc)*fraction});
if(monthlyGrowth<=0)return{status:'unreachable',label:'⚠️ Non atteignable'};
var sim=current;var months=0;
while(sim<target&&months<600){months++;sim+=monthlyGrowth}
if(months>=600)return{status:'unreachable',label:'⚠️ Non atteignable'};
var now=new Date();
var predDate=new Date(now.getFullYear(),now.getMonth()+months,1);
var predLabel=String(predDate.getMonth()+1).padStart(2,'0')+'/'+predDate.getFullYear();
var targetDate=obj.targetDate?new Date(obj.targetDate):null;
if(targetDate&&predDate<=targetDate)return{status:'ontrack',label:'✅ Prévu '+predLabel,months:months};
if(targetDate&&predDate>targetDate)return{status:'late',label:'⚠️ Prévu '+predLabel,months:months};
return{status:'ontrack',label:'✅ Prévu '+predLabel,months:months}}

function getMensualitesAtDate(targetDate){
var td=targetDate instanceof Date?targetDate:new Date(targetDate);
var tdMonth=td.getFullYear()*12+td.getMonth();
var total=0;var breakdown=[];
empruntsState.forEach(function(loan){
var cap=pf(loan.capital);if(cap<=0){breakdown.push({loan:loan,mens:0,ins:0,debt:0});return}
var sched=computeAmortSchedule(loan);
var sd=loan.startDate?new Date(loan.startDate):null;
if(!sd){breakdown.push({loan:loan,mens:0,ins:0,debt:cap});return}
var sdMonth=sd.getFullYear()*12+sd.getMonth();
var elapsed=tdMonth-sdMonth;
if(elapsed<0){breakdown.push({loan:loan,mens:0,ins:0,debt:0});return}
if(elapsed>=sched.schedule.length){breakdown.push({loan:loan,mens:0,ins:0,debt:0});return}
var entry=sched.schedule[elapsed];
var rem=elapsed>0?sched.schedule[elapsed-1].balance:cap;
if(entry.isDeferral&&entry.deferralType==='total'){
var insM=getInsuranceMonthly(loan,entry.balance);
breakdown.push({loan:loan,mens:insM,ins:insM,debt:entry.balance});total+=insM;return}
if(entry.isDeferral&&entry.deferralType==='partiel'){
var rateM=pf(loan.rate)/100/12;
var intM=rem*rateM;
var insM=getInsuranceMonthly(loan,rem);
var mensM=intM+insM;
breakdown.push({loan:loan,mens:mensM,ins:insM,debt:rem});total+=mensM;return}
var mensCalc=sched.mensualiteCalc||0;
var insM=getInsuranceMonthly(loan,rem);
var mensM=mensCalc+insM;
breakdown.push({loan:loan,mens:mensM,ins:insM,debt:rem});total+=mensM;
});
var totalDebt=breakdown.reduce(function(s,b){return s+b.debt},0);
return{total:total,breakdown:breakdown,totalDebt:totalDebt}}

function initSankeyHover(container){
var flows=Array.prototype.slice.call(container.querySelectorAll('.sk-flow'));
var bars=container.querySelectorAll('.sk-bar');
var pills=container.querySelectorAll('.sk-pill');
function resetAll(){flows.forEach(function(f){f.style.opacity='';f.style.filter=''});bars.forEach(function(b){b.style.opacity=''});pills.forEach(function(p){p.style.opacity='.85'})}
function downstream(nodeId){var nodes={},fl={};nodes[nodeId]=1;var queue=[nodeId];
while(queue.length){var n=queue.shift();flows.forEach(function(f){if(f.getAttribute('data-src')!==n)return;var fi=f.getAttribute('data-fi');if(fl[fi])return;fl[fi]=1;var d=f.getAttribute('data-dest');if(!nodes[d]){nodes[d]=1;queue.push(d)}})}
return{nodes:nodes,flows:fl}}
function revSel(revId){var sel={nodes:{},flows:{}};sel.nodes[revId]=1;flows.forEach(function(f){if(f.getAttribute('data-src')===revId){sel.flows[f.getAttribute('data-fi')]=1;sel.nodes[f.getAttribute('data-dest')]=1}});return sel}
function apply(sel){flows.forEach(function(f){f.style.opacity=sel.flows[f.getAttribute('data-fi')]?'0.7':'0.12'});bars.forEach(function(b){b.style.opacity=sel.nodes[b.getAttribute('data-skbar')]?'':'.45'});Object.keys(sel.nodes).forEach(function(id){var p=container.querySelector('.sk-pill[data-skbar="'+id+'"]');if(p){p.parentNode.appendChild(p);p.style.opacity='1'}})}
flows.forEach(function(flow){
flow.addEventListener('mouseenter',function(){var src=flow.getAttribute('data-src'),dest=flow.getAttribute('data-dest');var sel;
if(src.indexOf('rev')===0){sel={nodes:{},flows:{}};sel.nodes[src]=1;sel.nodes[dest]=1}else{sel=downstream(dest);sel.nodes[src]=1}
sel.flows[flow.getAttribute('data-fi')]=1;apply(sel)});
flow.addEventListener('mouseleave',resetAll)});
bars.forEach(function(bar){var bi=bar.getAttribute('data-skbar');
bar.addEventListener('mouseenter',function(){var sel;if(bi.indexOf('rev')===0){sel=revSel(bi)}else{sel=downstream(bi);flows.forEach(function(f){if(f.getAttribute('data-dest')===bi){sel.flows[f.getAttribute('data-fi')]=1;sel.nodes[f.getAttribute('data-src')]=1}})}apply(sel)});
bar.addEventListener('mouseleave',resetAll)})}

/* === Source de l'apport helpers === */
function getApportSourceOptions(){var opts=[{id:'',label:'Manuel (cash)'}];epargneState.forEach(function(acc){opts.push({id:'ep-'+acc.id,label:'\u00c9pargne : '+(acc.name||acc.type)})});investState.financier.forEach(function(acc){opts.push({id:'if-'+acc.id,label:'Invest : '+(acc.name||acc.type)})});return opts}
function resolveSourceAccount(sourceId){if(!sourceId)return null;var parts=sourceId.split('-');var prefix=parts[0];var accId=parts.slice(1).join('-');if(prefix==='ep'){var acc=epargneState.find(function(a){return a.id===accId});if(acc)return{prefix:'ep',acc:acc,type:'epargne'}}else if(prefix==='if'){var acc=investState.financier.find(function(a){return a.id===accId});if(acc)return{prefix:'if',acc:acc,type:'financier'}}return null}
function getSourceFiscalInfo(sourceId,apportNet,purchaseDate){if(!sourceId||!apportNet||apportNet<=0)return null;var resolved=resolveSourceAccount(sourceId);if(!resolved)return null;var acc=resolved.acc;if(resolved.type==='epargne'){var tp=(acc.type||'').toLowerCase();if(tp.indexOf('livret')>=0||tp==='ldds'||tp==='lep'||tp==='cel'||tp==='pel')return{brutNeeded:apportNet,netReceived:apportNet,taxLabel:'Livret r\u00e9glement\u00e9 : pas de fiscalit\u00e9',isWarning:false};return{brutNeeded:apportNet,netReceived:apportNet,taxLabel:'Retrait libre',isWarning:false}}if(resolved.type==='financier'){var bal=pf(acc.balance),gain=0;if(acc.gainMode==='eur')gain=pf(acc.gain);else if(bal>0&&pf(acc.gain)>0)gain=bal*pf(acc.gain)/100;if(bal<=0)return{brutNeeded:apportNet,netReceived:apportNet,taxLabel:'Solde insuffisant',isWarning:true};var gainProp=gain/bal;var gainsInW=apportNet*gainProp;var fi=FISCAL_INFO[acc.type];if(!fi)return{brutNeeded:apportNet,netReceived:apportNet,taxLabel:'',isWarning:false};var unlocked=false;var customDelay=acc.lockDuration!==undefined&&acc.lockDuration!==''?pf(acc.lockDuration):fi.delay;if(fi.unit==='na')unlocked=true;else if(fi.unit==='retraite')unlocked=false;else if(acc.dateOuverture&&purchaseDate){var openD=new Date(acc.dateOuverture),opD=new Date(purchaseDate),unlockD=new Date(openD);unlockD.setFullYear(unlockD.getFullYear()+customDelay);unlocked=opD>=unlockD}var taxRate=0,taxLabel='',isWarn=false;if(acc.type==='PEA'){if(unlocked){taxRate=0.172;taxLabel='PEA > '+customDelay+' ans : PS 17,2 %';isWarn=false}else{taxRate=0.30;taxLabel='PEA < '+customDelay+' ans : Flat tax 30 %';isWarn=true}}else if(acc.type==='Assurance-vie'){if(unlocked){var abat=4600,gainsAfter=Math.max(gainsInW-abat,0),tax2=gainsAfter*0.247;return{brutNeeded:Math.round(apportNet+tax2),netReceived:apportNet,taxLabel:'AV > '+customDelay+' ans : abattement 4 600 \u20ac puis 24,7 %',taxAmount:Math.round(tax2),isWarning:false}}else{taxRate=0.30;taxLabel='AV < '+customDelay+' ans : Flat tax 30 %';isWarn=true}}else{taxRate=0.30;taxLabel='Flat tax 30 % sur les gains';isWarn=false}var taxAmt=Math.round(gainsInW*taxRate);return{brutNeeded:Math.round(apportNet+taxAmt),netReceived:apportNet,taxLabel:taxLabel,taxAmount:taxAmt,isWarning:isWarn}}return null}
function syncApportOperation(investItem,investType){var sourceId=investItem.apportSource;var apport=pf(investItem.apport);var purchaseDate=investItem.purchaseDate||investItem.dateAcquisition||'';var investId=investItem.id;var investName=investItem.name||'Investissement';if(!sourceId||!apport||apport<=0){removeApportOps(investId);return}var resolved=resolveSourceAccount(sourceId);if(!resolved){removeApportOps(investId);return}var acc=resolved.acc;if(!acc.operations)acc.operations=[];var fiscal=getSourceFiscalInfo(sourceId,apport,purchaseDate);var brutNeeded=fiscal?fiscal.brutNeeded:apport;var existing=acc.operations.find(function(op){return op.autoManaged&&op.linkedInvestId===investId});if(existing){existing.type='Retrait partiel';existing.name='Apport pour '+investName;existing.amount=String(brutNeeded);existing.date=purchaseDate;existing.recurrence='Ponctuel'}else{acc.operations.push({id:genId(),type:'Retrait partiel',name:'Apport pour '+investName,amount:String(brutNeeded),date:purchaseDate,recurrence:'Ponctuel',linkedTo:'',autoManaged:true,linkedInvestId:investId})}if(resolved.type==='epargne')saveEpargne();else saveInvest()}
function removeApportOps(investId){var changed=false;epargneState.forEach(function(acc){if(!acc.operations)return;var before=acc.operations.length;acc.operations=acc.operations.filter(function(op){return !(op.autoManaged&&op.linkedInvestId===investId)});if(acc.operations.length!==before)changed=true});investState.financier.forEach(function(acc){if(!acc.operations)return;var before=acc.operations.length;acc.operations=acc.operations.filter(function(op){return !(op.autoManaged&&op.linkedInvestId===investId)});if(acc.operations.length!==before)changed=true});if(changed){saveEpargne();saveInvest()}}

function checkFundsAvailabilitySingle(fakeItem){
var sourceId=fakeItem.apportSource;
if(!sourceId)return null;
var res=resolveSourceAccount(sourceId);
if(!res)return null;
var apport=pf(fakeItem.apport)||0;
if(apport<=0)return null;
var dt=fakeItem.purchaseDate||fakeItem.dateAcquisition||'';
var fi=getSourceFiscalInfo(sourceId,apport,dt);
var brutNeeded=fi?fi.brutNeeded:apport;
var acc=res.acc;
var bal=pf(acc.balance)||0;
if(res.type==='epargne'){
var ops=(acc.operations||[]);
ops.forEach(function(op){
if(op.autoManaged)return;
var d=op.date||'';
if(dt&&d&&d<=dt){
bal+=(op.type==='versement'?1:-1)*(pf(op.amount)||0);
}
});
}
if(bal>=brutNeeded)return{ok:true,label:fmt(bal)+' € dispo'};
return{ok:false,label:'Solde insuffisant ('+fmt(bal)+' €)'};
}

function collectCalendarEvents(){
var now=new Date(),today=now.toISOString().slice(0,10),events=[];
// 1. Scheduled operations on épargne
epargneState.forEach(function(acc){
(acc.operations||[]).forEach(function(op){
if(!op.date||op.date<today)return;
var lab=(op.autoManaged?'🔗 ':'')+(op.type==='versement'?'Versement':'Retrait')+' '+fmt(pf(op.amount))+' € — '+(acc.name||acc.type);
events.push({date:op.date,type:'operation',icon:'💸',label:lab,amount:pf(op.amount)});
if(op.recurrence==='annual'){
var y=new Date(op.date).getFullYear()+1;
for(;y<=now.getFullYear()+40;y++){
var nd=op.date.replace(/^\d{4}/,y);
events.push({date:nd,type:'operation',icon:'💸',label:lab+' (annuel)',amount:pf(op.amount)});
}
}
});
// End of monthly contributions
if(acc.contribEndDate&&acc.contribEndDate>=today){
events.push({date:acc.contribEndDate,type:'fin',icon:'⛔',label:'Fin des versements — '+(acc.name||acc.type)});
}
});
// 2. Scheduled operations on invest financier
investState.financier.forEach(function(acc){
(acc.operations||[]).forEach(function(op){
if(!op.date||op.date<today)return;
var lab=(op.autoManaged?'🔗 ':'')+(op.type==='versement'?'Versement':'Retrait')+' '+fmt(pf(op.amount))+' € — '+(acc.name||acc.type);
events.push({date:op.date,type:'operation',icon:'💸',label:lab,amount:pf(op.amount)});
});
// Fiscal unlock
if(acc.dateOuverture){
var lockYears=acc.type==='PEA'?5:acc.type==='Assurance-vie'?8:0;
if(lockYears>0){
var od=new Date(acc.dateOuverture);
od.setFullYear(od.getFullYear()+lockYears);
var unlockDate=od.toISOString().slice(0,10);
if(unlockDate>=today){
events.push({date:unlockDate,type:'fiscal',icon:'🔓',label:'Déblocage fiscal '+(acc.name||acc.type)});
}
}
}
// End of monthly contributions
if(acc.contribEndDate&&acc.contribEndDate>=today){
events.push({date:acc.contribEndDate,type:'fin',icon:'⛔',label:'Fin des versements — '+(acc.name||acc.type)});
}
});
// 2b. Plafonds de versements atteints
[].concat(epargneState,investState.financier).forEach(function(acc){var x=simRecFor(acc);if(x&&x.ceil&&x.fullAt&&x.fullAt>0){events.push({date:simIsoMonth(x.fullAt),type:'fin',icon:'🧱',label:'Plafond de versements atteint — '+(acc.name||acc.type)})}});
// 3. Loans
empruntsState.forEach(function(loan){
if(loan.startDate&&loan.startDate>=today){
events.push({date:loan.startDate,type:'emprunt',icon:'🏦',label:'Début emprunt '+(loan.name||''),amount:pf(loan.amount)});
}
if(loan.startDate){
var sc=computeAmortSchedule(loan);
var ls=new Date(loan.startDate);
var endM=ls.getMonth()+sc.schedule.length;
var endDate=new Date(ls.getFullYear(),endM,1);
var ed=endDate.toISOString().slice(0,10);
if(ed>=today){
events.push({date:ed,type:'emprunt',icon:'🏦',label:'Fin emprunt '+(loan.name||'')});
}
}
});
// 4. Future purchases immobilier/autre
investState.immobilier.forEach(function(p){
if(p.purchaseDate&&p.purchaseDate>=today){
events.push({date:p.purchaseDate,type:'achat',icon:'🏠',label:'Achat '+(p.name||'immobilier'),amount:pf(p.purchasePrice)});
}
});
investState.autre.forEach(function(a){
if(a.dateAcquisition&&a.dateAcquisition>=today){
events.push({date:a.dateAcquisition,type:'achat',icon:'🏠',label:'Achat '+(a.name||'autre'),amount:pf(a.acquisitionCost||a.purchasePrice)});
}
});
// 5. Predicted achievement of objectives
objectifsState.forEach(function(obj){
var pred=predictObjectiveDate(obj);
if(pred.status==='projected'&&pred.date){
events.push({date:pred.date,type:'objectif',icon:'🎯',label:'🎯 '+(obj.name||'Objectif')+' atteint'});
}
});
// Filter and sort
events=events.filter(function(e){return calendarFilters[e.type]!==false});
events.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
return events;
}

function computeAmortSchedule(loan){var cap=pf(loan.capital),annualRate=pf(loan.rate),durMonths=pf(loan.durationMonths);var rateM=annualRate/100/12;var diffType=loan.differeType||'aucun';var diffMonths=pf(loan.differeMois);var durDisplayMode=loan.durDisplayMode||'mois';if(diffType!=='aucun'&&durDisplayMode==='ans'){diffMonths=Math.round(diffMonths*12)}var insBase=loan.insBase||'initial';var insMonthlyFixed=getInsuranceMonthly(loan);var startDate=loan.startDate?new Date(loan.startDate):null;var schedule=[];var bal=cap;if(bal<=0||durMonths<=0)return{schedule:[],totalInterest:0,totalInsurance:0,totalCost:0,mensualiteCalc:0};var repayMonths=Math.max(durMonths,1);var mensCalc=0;if(rateM>0){mensCalc=bal*rateM/(1-(Math.pow(1+rateM,-repayMonths)))}else{mensCalc=bal/repayMonths}var actualBal=bal;if(diffType==='total'&&diffMonths>0){for(var d=0;d<diffMonths;d++){var intM=actualBal*rateM;actualBal+=intM;var insM=insBase==='restant'?getInsuranceMonthly(loan,actualBal):insMonthlyFixed;schedule.push({month:d+1,capital:0,interest:intM,insurance:insM,balance:actualBal,payment:insM,isDeferral:true,deferralType:'total'})}if(rateM>0){mensCalc=actualBal*rateM/(1-(Math.pow(1+rateM,-repayMonths)))}else{mensCalc=actualBal/repayMonths}}else if(diffType==='partiel'&&diffMonths>0){for(var d=0;d<diffMonths;d++){var intM=actualBal*rateM;var insM=insBase==='restant'?getInsuranceMonthly(loan,actualBal):insMonthlyFixed;schedule.push({month:d+1,capital:0,interest:intM,insurance:insM,balance:actualBal,payment:intM+insM,isDeferral:true,deferralType:'partiel'})}}var m=diffMonths;while(actualBal>0.5&&m<720){m++;var intM=actualBal*rateM;var capM=Math.min(mensCalc-intM,actualBal);if(capM<0)capM=0;actualBal=Math.max(actualBal-capM,0);var insM=insBase==='restant'?getInsuranceMonthly(loan,actualBal+capM):insMonthlyFixed;schedule.push({month:m,capital:capM,interest:intM,insurance:insM,balance:actualBal,payment:capM+intM+insM,isDeferral:false})}var totalInt=schedule.reduce(function(s,r){return s+r.interest},0);if(diffType==='total'&&diffMonths>0){var origBal=cap;var balAfterDiff=origBal;for(var dd=0;dd<diffMonths;dd++){balAfterDiff=balAfterDiff*(1+rateM)}var capitalizedInt=balAfterDiff-origBal;totalInt=capitalizedInt+schedule.filter(function(r){return !r.isDeferral}).reduce(function(s,r){return s+r.interest},0)}var totalIns=schedule.reduce(function(s,r){return s+r.insurance},0);return{schedule:schedule,totalInterest:totalInt,totalInsurance:totalIns,totalCost:totalInt+totalIns,mensualiteCalc:mensCalc,diffMonths:diffMonths}}

pan><span style="font-weight:600;color:var(--red);margin-left:auto" id="pat-empr-val">'+fmt(Math.round(pAtY.totEmpr))+' \u20ac</span></div>';(patrimoineState.autresDettes||[]).forEach(function(d,i){h+='<div class="item-row"><input class="ed-input" value="'+escHTML(d.name)+'" placeholder="Nom" data-pi="'+i+'" data-pf="name" data-pc="autresDettes"><input class="ed-amount" value="'+(d.amount||'')+'" placeholder="0" data-pi="'+i+'" data-pf="amount" data-pc="autresDettes" inputmode="decimal"><span class="item-currency">€</span><button class="item-delete" data-pdel="'+i+'" data-pdc="autresDettes">'+ICON_TRASH+'</button></div>'});h+='<button class="add-btn" data-padd="autresDettes">'+ICON_PLUS+' Ajouter une dette</button></div>';h+='<div class="card" style="padding:0;overflow:hidden;margin-top:6px" id="pat-summary-table">'+renderPatrimoineSummaryTable(pAtY)+'</div>';el.innerHTML=h;el.querySelectorAll('[data-pf]').forEach(function(inp){var fn=function(){var i=+inp.dataset.pi,f=inp.dataset.pf,col=inp.dataset.pc;if(patrimoineState[col]&&patrimoineState[col][i]){patrimoineState[col][i][f]=inp.value;savePatrimoine();updatePatrimoineComputed()}};inp.addEventListener('input',fn);inp.addEventListener('change',fn)});el.querySelectorAll('[data-pdel]').forEach(function(b){b.onclick=function(){patrimoineState[b.dataset.pdc].splice(+b.dataset.pdel,1);savePatrimoine();renderPatrimoine()}});el.querySelectorAll('[data-padd]').forEach(function(b){b.onclick=function(){patrimoineState.autresDettes.push({id:genId(),name:'',amount:''});savePatrimoine();renderPatrimoine()}});var patSlider=el.querySelector('#pat-slider');if(patSlider){patSlider.addEventListener('input',function(){projectionRange=+patSlider.value;updatePatrimoineSliderView()});patSlider.addEventListener('change',function(){renderPatrimoine()});initSliderFloat(patSlider)};el.querySelectorAll('.pat-chart-hover').forEach(function(zone){var tooltip=document.getElementById('pat-proj-tooltip');if(!tooltip)return;var ptsData=JSON.parse(zone.dataset.pts);var pl=+zone.dataset.pl;var cw=+zone.dataset.chartw;var yrs=+zone.dataset.years;zone.addEventListener('mousemove',function(e){var svg=zone.closest('svg');if(!svg)return;var rect=svg.getBoundingClientRect();var mx=e.clientX-rect.left;var scale=1060/rect.width;var sx=mx*scale;var yearFrac=(sx-pl)/cw*yrs;var yi=Math.max(0,Math.min(ptsData.length-1,Math.round(yearFrac)));var d=ptsData[yi];var yr=d.y===0?'Aujourd\'hui':'Ann\u00e9e '+d.y+' ('+(new Date().getFullYear()+d.y)+')';tooltip.style.display='block';tooltip.innerHTML='<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;font-weight:500">'+yr+'</div><div style="color:#FFD600;font-weight:600;margin-bottom:6px">Patrimoine net : '+fmt(d.net)+' \u20ac</div><div style="color:#4DB6AC;margin-bottom:2px">\ud83d\udcb0 \u00c9pargne : '+fmt(d.ep)+' \u20ac</div><div style="color:#7B8CDE;margin-bottom:2px">\ud83d\udcc8 Invest. financier : '+fmt(d.fin)+' \u20ac</div><div style="color:#C8956C;margin-bottom:2px">\ud83c\udfe0 Immobilier net : '+fmt(d.immo)+' \u20ac</div><div style="color:#9575CD;margin-bottom:2px">\ud83c\udfa8 Autres actifs : '+fmt(d.autre)+' \u20ac</div><div style="color:#E57373;margin-bottom:2px">\ud83c\udfe6 Emprunts restants : -'+fmt(d.debt)+' \u20ac</div>'+(d.ad>0?'<div style="color:#E57373;margin-bottom:2px">Autres dettes : -'+fmt(d.ad)+' \u20ac</div>':'')+'<div style="color:var(--text-bright);margin-top:4px;padding-top:4px;border-top:1px solid var(--border);font-weight:600">Net : '+fmt(d.net)+' \u20ac</div>';var tipX=mx+15;var tipY=e.clientY-rect.top-30;if(tipX+260>rect.width)tipX=mx-260;tooltip.style.left=tipX+'px';tooltip.style.top=tipY+'px'});zone.addEventListener('mouseleave',function(){tooltip.style.display='none'})})}

function updatePatrimoineComputed(){var pAtY=computePatrimoineAtYear(projectionRange);var nv=document.getElementById('pat-net-val');if(nv)nv.textContent=fmt(Math.round(pAtY.net))+' \u20ac';var hl2=document.getElementById('pat-hero-line2');if(hl2)hl2.textContent=projectionRange===0?"Aujourd\x27hui":'Projection \u00e0 '+projectionRange+' an'+(projectionRange>1?'s':'');var emv=document.getElementById('pat-empr-val');if(emv)emv.textContent=fmt(Math.round(pAtY.totEmpr))+' \u20ac';var slicesU=[{label:'\u00c9pargne',value:pAtY.totEp,color:'#4DB6AC'},{label:'Invest. financier',value:pAtY.totInvFin,color:'#7B8CDE'},{label:'Invest. immobilier',value:pAtY.totInvImmoNet,color:'#C8956C'},{label:'Invest. autre',value:pAtY.totInvAutre,color:'#9575CD'}];var da=document.getElementById('pat-donut-area');if(da)da.innerHTML=renderDonut(slicesU,pAtY.totalActifs);var pc=document.getElementById('proj-chart');if(pc)pc.innerHTML=renderProjectionChart();var st=document.getElementById('pat-summary-table');if(st)st.innerHTML=renderPatrimoineSummaryTable(pAtY)}

function renderPatrimoineSummaryTable(pData){var p=pData||computePatrimoineAtYear(projectionRange);return '<table class="summary-table"><thead><tr><th>Poste</th><th style="text-align:right">Montant</th></tr></thead><tbody><tr><td class="label">\u00c9pargne</td><td class="value positive">'+fmt(p.totEp)+' \u20ac</td></tr><tr><td class="label">Investissements financiers</td><td class="value positive">'+fmt(p.totInvFin)+' \u20ac</td></tr><tr><td class="label">Investissements immobiliers (net)</td><td class="value positive">'+fmt(p.totInvImmoNet)+' \u20ac</td></tr><tr><td class="label">Autres investissements</td><td class="value positive">'+fmt(p.totInvAutre)+' \u20ac</td></tr><tr><td class="label" style="font-weight:600">Total Actifs</td><td class="value positive" style="font-weight:700">'+fmt(p.totalActifs)+' \u20ac</td></tr><tr><td class="label">Emprunts</td><td class="value negative">'+fmt(p.totEmpr)+' \u20ac</td></tr><tr><td class="label">Autres dettes</td><td class="value negative">'+fmt(p.totAutresD)+' \u20ac</td></tr><tr><td class="label" style="font-weight:600">Total Passifs</td><td class="value negative" style="font-weight:700">'+fmt(p.totalPassifs)+' \u20ac</td></tr><tr><td class="label" style="font-weight:700;font-size:15px">Patrimoine Net</td><td class="value accent-val" style="font-weight:700;font-size:15px">'+fmt(p.net)+' \u20ac</td></tr></tbody></table>'}

function computePatrimoineAtYear(y){var epVal=epProjTotal(y);var finVal=finProjTotalAt(y);var immoNetVal=0;investState.immobilier.forEach(function(p){var d=getImmoProjectionData(p,y);immoNetVal+=Math.max(d.totalValue-d.loanRemaining,0)});var autreVal=0;investState.autre.forEach(function(a){var pp=pf(a.purchasePrice||a.value);if(pp<=0)return;var now2=new Date(),cy2=now2.getFullYear(),ty2=cy2+y;var ay=a.dateAcquisition?new Date(a.dateAcquisition).getFullYear():cy2;if(ty2<ay)return;var ysa=ty2-ay;var isM=a.valuationMode==='manual';var cv=isM?pf(a.currentValue):pp;autreVal+=cv*Math.pow(1+pf(a.rendement||0)/100,ysa)});var debtRemaining=getDebtAtYear(y);var totAutresD=(patrimoineState.autresDettes||[]).reduce(function(s,d){return s+pf(d.amount)},0);var totalActifs=epVal+finVal+immoNetVal+autreVal;var net=totalActifs-debtRemaining-totAutresD;return{totEp:Math.round(epVal),totInvFin:Math.round(finVal),totInvImmoNet:Math.round(immoNetVal),totInvAutre:Math.round(autreVal),totalActifs:Math.round(totalActifs),totEmpr:Math.round(debtRemaining),totAutresD:Math.round(totAutresD),totalPassifs:Math.round(debtRemaining+totAutresD),net:Math.round(net)}}
function buildPatrimoinePts(years){var pts=[];for(var y=0;y<=years;y++){var d=computePatrimoineAtYear(y);pts.push({year:y,ep:d.totEp,fin:d.totInvFin,immo:d.totInvImmoNet,autre:d.totInvAutre,debt:d.totEmpr,ad:d.totAutresD,total:d.net})}return pts}
function renderProjectionChart(){var years=projectionRange;if(years===0)return '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:12px">Déplacez le curseur pour afficher la projection.</div>';var W=1060,H=320,PL=70,PR=120,PT=20,PB=40;var chartW=W-PL-PR,chartH=H-PT-PB;var pts=buildPatrimoinePts(years);if(pts.length<2)return '<div style="text-align:center;padding:40px;color:var(--text-muted);font-size:13px">Ajoutez des actifs pour voir la projection.</div>';var cats=[{key:'ep',label:'Épargne',color:'#4DB6AC'},{key:'fin',label:'Financier',color:'#7B8CDE'},{key:'immo',label:'Immobilier',color:'#C8956C'},{key:'autre',label:'Autre',color:'#9575CD'}];var maxVal=1;pts.forEach(function(p){var stack=Math.max(p.ep,0)+Math.max(p.fin,0)+Math.max(p.immo,0)+Math.max(p.autre,0);if(stack>maxVal)maxVal=stack});function xP(i){return PL+(i/(pts.length-1))*chartW}function yP(v){return PT+chartH-((v/maxVal)*chartH)}var gridSvg='';for(var g=0;g<=5;g++){var gv=(maxVal/5)*g;var gy=yP(gv);gridSvg+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="rgba(255,255,255,0.07)" stroke-dasharray="3 3"/>';gridSvg+='<text x="'+(PL-8)+'" y="'+(gy+4)+'" fill="#5a6b80" font-size="10" text-anchor="end" font-family="Inter,system-ui,sans-serif">'+(gv>=1000000?fmtDec(gv/1000000,1)+'M':gv>=1000?fmt(Math.round(gv/1000))+'k':fmt(Math.round(gv)))+'</text>'}var xLabels='';var xStep=pts.length<=6?1:pts.length<=12?2:Math.ceil(pts.length/6);var now=new Date();pts.forEach(function(p,i){if(i%xStep===0||i===pts.length-1){xLabels+='<text x="'+xP(i)+'" y="'+(H-8)+'" fill="#5a6b80" font-size="10" text-anchor="middle" font-family="Inter,system-ui,sans-serif">'+(p.year===0?'Auj.':(now.getFullYear()+p.year))+'</text>'}});var areaSvg='';var baseLine=[];for(var i=0;i<pts.length;i++)baseLine.push(0);cats.forEach(function(cat){var topLine=[];for(var i=0;i<pts.length;i++){topLine.push(baseLine[i]+Math.max(pts[i][cat.key],0))}var path='M'+xP(0)+','+yP(topLine[0]);for(var i=1;i<pts.length;i++)path+=' L'+xP(i)+','+yP(topLine[i]);var fill=path;for(var i=pts.length-1;i>=0;i--)fill+=' L'+xP(i)+','+yP(baseLine[i]);fill+=' Z';areaSvg+='<path d="'+fill+'" fill="'+cat.color+'" opacity="0.35"/>';areaSvg+='<path d="'+path+'" fill="none" stroke="'+cat.color+'" stroke-width="1.5"/>';baseLine=topLine.slice()});var lastP=pts[pts.length-1];var endLabels='';var lx=xP(pts.length-1)+8;var cumY2=0;var catsCopy=cats.slice().reverse();catsCopy.forEach(function(cat){var val=Math.max(lastP[cat.key],0);cumY2+=val;var labelY=yP(cumY2-val/2);endLabels+='<text x="'+lx+'" y="'+(labelY+4)+'" fill="'+cat.color+'" font-size="9" font-weight="500" font-family="Inter,system-ui,sans-serif">'+cat.label+' : '+fmt(val)+' €</text>'});endLabels+='<text x="'+lx+'" y="'+(yP(maxVal)-8)+'" fill="var(--text-bright)" font-size="10" font-weight="700" font-family="Inter,system-ui,sans-serif">Net : '+fmt(Math.round(lastP.total))+' €</text>';var ptsJson=JSON.stringify(pts.map(function(p){return{y:p.year,ep:p.ep,fin:p.fin,immo:p.immo,autre:p.autre,debt:p.debt,ad:p.ad,net:Math.round(p.total)}}));return '<div style="position:relative"><svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block" id="pat-proj-svg"><defs></defs>'+gridSvg+areaSvg+xLabels+endLabels+'<rect width="'+W+'" height="'+H+'" fill="transparent" class="pat-chart-hover" data-pts="'+escHTML(ptsJson)+'" data-pl="'+PL+'" data-chartw="'+chartW+'" data-years="'+years+'"/></svg><div id="pat-proj-tooltip" style="display:none;position:absolute;pointer-events:none;background:rgba(19,21,38,0.95);border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-size:12px;z-index:10;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)"></div></div><div style="display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:11px;flex-wrap:wrap"><span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:3px;background:#4DB6AC;border-radius:2px;display:inline-block"></span><span style="color:var(--text-muted)">Épargne</span></span><span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:3px;background:#7B8CDE;border-radius:2px;display:inline-block"></span><span style="color:var(--text-muted)">Financier</span></span><span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:3px;background:#C8956C;border-radius:2px;display:inline-block"></span><span style="color:var(--text-muted)">Immobilier</span></span><span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:3px;background:#9575CD;border-radius:2px;display:inline-block"></span><span style="color:var(--text-muted)">Autre</span></span></div>'}
function renderDonut(slices,total){if(total<=0)return '<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px">Aucun actif enregistré</div>';var sz=140,cx=sz/2,cy=sz/2,r=55,sw=22;var svg='<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'">';var cumAngle=-Math.PI/2;slices.filter(function(s){return s.value>0}).forEach(function(s){var angle=(s.value/total)*2*Math.PI;var x1=cx+r*Math.cos(cumAngle),y1=cy+r*Math.sin(cumAngle);cumAngle+=angle;var x2=cx+r*Math.cos(cumAngle),y2=cy+r*Math.sin(cumAngle);var large=angle>Math.PI?1:0;svg+='<path d="M'+x1+','+y1+' A'+r+','+r+' 0 '+large+' 1 '+x2+','+y2+'" fill="none" stroke="'+s.color+'" stroke-width="'+sw+'" stroke-linecap="butt"/>'});svg+='</svg>';var legend=slices.map(function(s){return '<div class="donut-legend-item"><div class="donut-legend-dot" style="background:'+s.color+'"></div>'+escHTML(s.label)+' : <strong style="color:var(--text-bright)">'+fmt(Math.round(s.value))+' €</strong> ('+(total>0?Math.round(s.value/total*100):0)+' %)</div>'}).join('');return '<div class="donut-wrap">'+svg+'<div class="donut-legend">'+legend+'</div></div>'}

function calcFiscalImpact(acc,op){
/* Returns {taxRate, taxLabel, gainsAtDate, taxAmount, netAmount, isWarning} */
var bal=pf(acc.balance),gain=0;
if(acc.gainMode==='eur')gain=pf(acc.gain);
else if(bal>0&&pf(acc.gain)>0)gain=bal*pf(acc.gain)/100;
var invested=Math.max(bal-gain,0);
var opAmount=pf(op.amount);
if(op.type==='Clôture totale')opAmount=bal;
if(bal<=0)return{taxRate:0,taxLabel:'',gainsAtDate:0,taxAmount:0,netAmount:opAmount,isWarning:false};
/* proportion of gains in withdrawn amount */
var gainProportion=gain/bal;
var gainsInOp=opAmount*gainProportion;
var fi=FISCAL_INFO[acc.type];
if(!fi)return{taxRate:0,taxLabel:'Pas de données fiscales',gainsAtDate:Math.round(gainsInOp),taxAmount:0,netAmount:opAmount,isWarning:false};
/* Check fiscal age */
var unlocked=false;
var customDelay=acc.lockDuration!==undefined&&acc.lockDuration!==''?pf(acc.lockDuration):fi.delay;
if(fi.unit==='na')unlocked=true;
else if(fi.unit==='retraite')unlocked=false;
else if(acc.dateOuverture&&op.date){
var openD=new Date(acc.dateOuverture);
var opD=new Date(op.date);
var unlockD=new Date(openD);unlockD.setFullYear(unlockD.getFullYear()+customDelay);
unlocked=opD>=unlockD}
var taxRate,taxLabel,isWarn;
if(acc.type==='PEA'){
if(unlocked){taxRate=0.172;taxLabel='PEA > '+customDelay+' ans : PS 17,2 % sur les gains';isWarn=false}
else{taxRate=0.30;taxLabel='PEA < '+customDelay+' ans : Flat tax 30 %';isWarn=true}
}else if(acc.type==='Assurance-vie'){
if(unlocked){
var abattement=4600;
var gainsAfterAbat=Math.max(gainsInOp-abattement,0);
var tax=gainsAfterAbat*0.247;
return{taxRate:0.247,taxLabel:'AV > '+customDelay+' ans : Abattement 4 600 € puis 24,7 %',gainsAtDate:Math.round(gainsInOp),taxAmount:Math.round(tax),netAmount:Math.round(opAmount-tax),isWarning:false}
}else{taxRate=0.30;taxLabel='AV < '+customDelay+' ans : Flat tax 30 %';isWarn=true}
}else if(acc.type==='PER'){
taxRate=0.30;taxLabel='PER : Imposé à la sortie (barème IR ~30 %)';isWarn=true
}else if(acc.type==='PEE'){
if(unlocked){taxRate=0.172;taxLabel='PEE > '+customDelay+' ans : PS 17,2 %';isWarn=false}
else{taxRate=0.30;taxLabel='PEE < '+customDelay+' ans : Flat tax 30 %';isWarn=true}
}else{
taxRate=0.30;taxLabel='Flat tax 30 % sur les gains';isWarn=false
}
var taxAmt=Math.round(gainsInOp*taxRate);
return{taxRate:taxRate,taxLabel:taxLabel,gainsAtDate:Math.round(gainsInOp),taxAmount:taxAmt,netAmount:Math.round(opAmount-taxAmt),isWarning:isWarn}
}

function projectLoanRemaining(loan,years){
var pts=[];
var sched=computeAmortSchedule(loan);
var now=new Date();var cy=now.getFullYear();var cm=now.getMonth();
for(var y=0;y<=years;y++){
var targetYear=cy+y;
if(!loan.startDate||sched.schedule.length===0){
pts.push({year:y,value:pf(loan.capital)});continue}
var ls=new Date(loan.startDate),lsy=ls.getFullYear(),lsm=ls.getMonth();
var elapsed=(targetYear*12+cm)-(lsy*12+lsm);
if(elapsed<=0){pts.push({year:y,value:0});continue}
if(elapsed>=sched.schedule.length){pts.push({year:y,value:0});continue}
pts.push({year:y,value:sched.schedule[elapsed-1].balance})}
return pts}

// ─── PURE scenario calculation: patrimoine at year Y ───
function scenPatrimoineAtYear(data,y,levers,events){
levers=levers||{};if(!Array.isArray(events))events=[];
var rateAdj=spf(levers.rateAdj);
var immoAdj=spf(levers.immoAdj);
var extraMonthly=spf(levers.extraMonthly);
var inflation=spf(levers.inflation)/100;
var excludeIds=levers.excludeIds||[];
var now=new Date(),cy=now.getFullYear(),cm=now.getMonth();
// Épargne + Financier (moteur unifié : plafonds, fin des versements, débordement)
var _ssum=scenSimSum(data,levers,y);var epVal=_ssum.ep;
var finAccs=data.investissements&&data.investissements.financier||[];
var finVal=_ssum.fin;
// Immobilier
var immoNet=0;
(data.investissements&&data.investissements.immobilier||[]).forEach(function(p){
if(excludeIds.indexOf(p.id)>=0)return;
var pp=spf(p.purchasePrice);if(pp<=0)return;
var py=p.purchaseDate?new Date(p.purchaseDate).getFullYear():cy;
var ty=cy+y;
if(ty<py)return;
var ysp=ty-py;
var appr=(spf(p.appreciation)||2)+immoAdj;
var val=pp*Math.pow(1+appr/100,ysp);
var loanRem=0;
if(p.loanId){
var loan=(data.emprunts||[]).find(function(l){return l.id===p.loanId});
if(loan){
var sc=computeAmortSchedule(loan);
if(sc.schedule.length>0){
var ls=loan.startDate?new Date(loan.startDate):now;
var startMonth=ls.getFullYear()*12+ls.getMonth();
var targetMonth=(cy+y)*12+cm;
var elapsed=targetMonth-startMonth;
if(elapsed>0&&elapsed<sc.schedule.length){
loanRem=sc.schedule[elapsed-1].balance;
}else if(elapsed<=0){
loanRem=spf(loan.capital);
}
}
}
}
immoNet+=Math.max(val-loanRem,0);
});
// Autre
var autreVal=0;
(data.investissements&&data.investissements.autre||[]).forEach(function(a){
if(excludeIds.indexOf(a.id)>=0)return;
var pp=spf(a.purchasePrice||a.acquisitionCost||a.value||a.currentValue||0);
if(pp<=0)return;
var ay=a.dateAcquisition?new Date(a.dateAcquisition).getFullYear():cy;
var ty2=cy+y;
if(ty2<ay)return;
var ysa=ty2-ay;
var isM=a.valuationMode==='manual';
var cv=isM?spf(a.currentValue):pp;
autreVal+=cv*Math.pow(1+spf(a.rendement||0)/100,ysa);
});
// Debt
var debtVal=0;
(data.emprunts||[]).forEach(function(loan){
var sc=computeAmortSchedule(loan);
if(!loan.startDate||sc.schedule.length===0){
debtVal+=spf(loan.capital);return;
}
var ls=new Date(loan.startDate);
var startMonth=ls.getFullYear()*12+ls.getMonth();
var targetMonth=(cy+y)*12+cm;
var elapsed=targetMonth-startMonth;
if(elapsed<=0)return;
if(elapsed>=sc.schedule.length)return;
debtVal+=sc.schedule[elapsed-1].balance;
});
var totAutresD=(data.patrimoine&&data.patrimoine.autresDettes||[]).reduce(function(s,d){return s+spf(d.amount)},0);
// Events
var eventsCash=0;
events.forEach(function(ev){
var sd=ev.dateStart||'';var ed=ev.dateEnd||'';
if(ev.type==='cash_in'||ev.type==='cash_out'){
if(ev.date){
var evY=new Date(ev.date).getFullYear();
var ey=evY-cy;
if(ey>=0&&ey<=y){
var amt=spf(ev.amount);
eventsCash+=(ev.type==='cash_in'?1:-1)*amt*Math.pow(1+spf(levers.inflation||0)/100,y-ey);
}
}
}else if(ev.type==='monthly_expense'){
var amt=spf(ev.amount);
for(var m=0;m<y*12;m++){
var mDate=new Date(cy,cm+m,1);
var mStr=mDate.toISOString().slice(0,7);
if(sd&&mStr<sd.slice(0,7))continue;
if(ed&&mStr>ed.slice(0,7))continue;
eventsCash-=amt;
}
}
});
epVal+=eventsCash;
var net=epVal+finVal+immoNet+autreVal-debtVal-totAutresD;
return{net:isFinite(net)?net:0,ep:isFinite(epVal)?epVal:0,fin:isFinite(finVal)?finVal:0,immo:isFinite(immoNet)?immoNet:0,autre:isFinite(autreVal)?autreVal:0,debt:isFinite(debtVal)?debtVal:0,ad:isFinite(totAutresD)?totAutresD:0};
}

var wr=withdrawalRate/100;

if(!fs||!fs.age)return null;

function scenMatelasSeuil(){
var monthlyExp=spf(localStorage.getItem('life-dashboard-monthly-expenses-total'));

// ─── Louer ou acheter computation ───
function computeLouerAcheter(sc,years){
var p=sc.louerParams||{};
var loyer=spf(p.loyer),prix=spf(p.prix),apport=spf(p.apport);
var taux=spf(p.empruntTaux)/100/12,duree=spf(p.empruntDuree)*12;
var charges=spf(p.charges),appr=spf(p.appreciation)/100;
var rendAlt=spf(p.rendementAlt)/100/12;
var infl=spf(p.inflation)/100;
var mensLoan=0;
var emprunt=prix-apport;
if(emprunt>0&&taux>0&&duree>0){
mensLoan=emprunt*taux/(1-Math.pow(1+taux,-duree));
}else if(emprunt>0&&duree>0){
mensLoan=emprunt/duree;
}
var coutMensAchat=mensLoan+charges;
var acheter=[],louerArr=[],bascule=-1;
var patriAchat=0,patriLouer=apport;
for(var m=0;m<=years*12;m++){
var yr=m/12;
var valBien=prix*Math.pow(1+appr/12,m);
var loanRem=0;
if(m<duree&&emprunt>0){
if(taux>0){loanRem=emprunt*Math.pow(1+taux,m)-mensLoan*(Math.pow(1+taux,m)-1)/taux}
else{loanRem=emprunt-mensLoan*m}
if(loanRem<0)loanRem=0;
}
patriAchat=valBien-loanRem;
var loyerM=loyer*Math.pow(1+infl/12,m);
var diff=coutMensAchat-loyerM;
if(diff>0&&rendAlt>0){patriLouer+=patriLouer*rendAlt}
else if(diff<0){patriLouer+=(-diff)}
patriLouer+=patriLouer*rendAlt;
if(m%12===0){
acheter.push(isFinite(patriAchat)?patriAchat:0);
louerArr.push(isFinite(patriLouer)?patriLouer:0);
if(bascule<0&&patriAchat>patriLouer)bascule=m/12;
}
}
return{acheter:acheter,louer:louerArr,bascule:bascule};
}

// ─── Stress test modifier ───
function applyStressToValue(val,y,params){
if(!params)return val;
var now=new Date(),cy=now.getFullYear();
var dropYear=params.date?new Date(params.date).getFullYear()-cy:1;
var drop=spf(params.drop)/100;
var recovery=spf(params.recovery)||3;
if(y<dropYear)return val;
if(y===dropYear)return val*(1-drop);
var recoveryProgress=Math.min((y-dropYear)/recovery,1);
return val*(1-drop+drop*recoveryProgress);
}

// ─── Full scenario points builder ───
function buildScenarioPoints(sc,years){
var pts=[];
for(var y=0;y<=years;y++){
var d=scenPatrimoineAtYear(sc.data,y,sc.levers,sc.events);
if(sc.stressParams){
d.fin=applyStressToValue(d.fin,y,sc.stressParams);
if(sc.stressParams.applyImmo)d.immo=applyStressToValue(d.immo,y,sc.stressParams);
d.net=d.ep+d.fin+d.immo+d.autre-d.debt-d.ad;
}
pts.push(d);
}
return pts;
}

pts[y2].pi=scenPassiveIncome(sc.data,y2,sc.levers);
}

// ─── Chart ───
var _scenAllSeries=null;var _scenYears=40;
function renderScenChart(allSeries,years){
var el=document.getElementById('scen-chart');
if(!el)return;
_scenAllSeries=allSeries;_scenYears=years;
var mk=scenMetric;
var W=1060,H=300,PL=70,PR=30,PT=20,PB=40;
var cW=W-PL-PR,cH=H-PT-PB;
var maxV=-Infinity,minV=Infinity;
allSeries.forEach(function(s){s.pts.forEach(function(p){var v=spf(p[mk]);if(v>maxV)maxV=v;if(v<minV)minV=v})});
if(!isFinite(maxV))maxV=1;if(!isFinite(minV))minV=0;
var range=maxV-minV||1;
function sx(i){return PL+i/years*cW}
function sy(v){return PT+cH-(spf(v)-minV)/range*cH}
var svg='<div style="position:relative"><svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block" id="scen-svg">';
svg+='<defs>';
allSeries.forEach(function(s,si){
svg+='<linearGradient id="sg-'+si+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+s.color+'" stop-opacity="0.12"/><stop offset="100%" stop-color="'+s.color+'" stop-opacity="0.02"/></linearGradient>';
});
svg+='</defs>';
for(var g=0;g<=4;g++){var gy=PT+cH*g/4;svg+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="var(--border)" stroke-dasharray="3,3"/>';svg+='<text x="'+(PL-8)+'" y="'+(gy+4)+'" text-anchor="end" fill="var(--text-muted)" font-size="10">'+sfmt(maxV-(maxV-minV)*g/4)+' €</text>'}
allSeries.forEach(function(s,si){
var path='',area='';
for(var i=0;i<=years;i++){
var v=spf(s.pts[i]?s.pts[i][mk]:0);
var x=sx(i),yv=sy(v);
path+=(i===0?'M':'L')+x.toFixed(1)+','+yv.toFixed(1);
area+=(i===0?'M':'L')+x.toFixed(1)+','+yv.toFixed(1);
}
area+='L'+sx(years).toFixed(1)+','+(PT+cH)+' L'+PL+','+(PT+cH)+' Z';
if(!s.dashed)svg+='<path d="'+area+'" fill="url(#sg-'+si+')"/>';
svg+='<path d="'+path+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.dashed?'1.5':'2.5')+'"'+(s.dashed?' stroke-dasharray="6,3"':'')+' class="scen-line" data-si="'+si+'"/>';
});
// Hover overlay, guide line, dots
svg+='<line id="scen-guide" x1="0" y1="'+PT+'" x2="0" y2="'+(PT+cH)+'" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4,3" style="display:none"/>';
allSeries.forEach(function(s,si){
svg+='<circle id="scen-dot-'+si+'" cx="0" cy="0" r="4" fill="'+s.color+'" stroke="rgba(0,0,0,.4)" stroke-width="1" style="display:none"/>';
});
svg+='<rect id="scen-hover-zone" x="'+PL+'" y="'+PT+'" width="'+cW+'" height="'+cH+'" fill="transparent" style="cursor:crosshair"/>';
// X axis labels
for(var xi=0;xi<=4;xi++){var xp=PL+cW*xi/4;var yr=Math.round(years*xi/4);svg+='<text x="'+xp+'" y="'+(H-5)+'" text-anchor="middle" fill="var(--text-muted)" font-size="10">'+yr+' ans</text>'}
svg+='</svg>';
// Tooltip div
svg+='<div id="scen-tip" style="display:none;position:absolute;pointer-events:none;background:rgba(19,21,38,0.95);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:12px;z-index:200;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:380px;overflow:hidden"></div>';
svg+='</div>';
// Legend

allSeries.forEach(function(s){
svg+='<span><span style="display:inline-block;width:14px;height:3px;background:'+s.color+';vertical-align:middle;margin-right:4px;border-radius:2px;'+(s.dashed?'border-top:1px dashed '+s.color:'')+'"></span>'+s.name+'</span>';
});
svg+='</div>';
el.innerHTML=svg;
attachScenChartHover();
}

function attachScenChartHover(){
var svgEl=document.getElementById('scen-svg');
var zone=document.getElementById('scen-hover-zone');
var guide=document.getElementById('scen-guide');
var tip=document.getElementById('scen-tip');
if(!svgEl||!zone||!guide||!tip)return;
var allSeries=_scenAllSeries;var years=_scenYears;
if(!allSeries)return;
var mk=scenMetric;
var W=1060,PL=70,PR=30,PT=20,PB=40;
var cW=W-PL-PR,cH=300-PT-PB;
var maxV=-Infinity,minV=Infinity;
allSeries.forEach(function(s){s.pts.forEach(function(p){var v=spf(p[mk]);if(v>maxV)maxV=v;if(v<minV)minV=v})});
if(!isFinite(maxV))maxV=1;if(!isFinite(minV))minV=0;
var range=maxV-minV||1;
function sx(i){return PL+i/years*cW}
function sy(v){return PT+cH-(spf(v)-minV)/range*cH}
var fireAge=null;
try{var fs=JSON.parse(localStorage.getItem('life-dashboard-fire'));if(fs&&fs.age)fireAge=parseInt(fs.age)}catch(e){}
var metricLabels={'net':'Patrimoine net','ep':'Liquidités','debt':'Dettes','pi':'Revenus passifs'};
zone.addEventListener('mousemove',function(e){
var rect=svgEl.getBoundingClientRect();
var mouseX=e.clientX-rect.left;
var scale=W/rect.width;
var svgX=mouseX*scale;
var yearFrac=(svgX-PL)/cW*years;
var yi=Math.max(0,Math.min(years,Math.round(yearFrac)));
var gx=sx(yi);
guide.setAttribute('x1',gx);guide.setAttribute('x2',gx);guide.style.display='';
// Dots
allSeries.forEach(function(s,si){
var dot=document.getElementById('scen-dot-'+si);
if(!dot)return;
var v=spf(s.pts[yi]?s.pts[yi][mk]:0);
dot.setAttribute('cx',gx);dot.setAttribute('cy',sy(v));dot.style.display='';
});
// Build tooltip
var hdr='<div style="font-weight:600;margin-bottom:6px;color:var(--text-bright)">Année '+yi+(fireAge?' <span style="color:var(--text-muted);font-weight:400">(âge '+(fireAge+yi)+')</span>':'')+'</div>';
var refPt=allSeries[0]?allSeries[0].pts[yi]:null;
var refVal=refPt?spf(refPt[mk]):0;
var lines='';
allSeries.forEach(function(s,si){
var pt=s.pts[yi];
var v=pt?spf(pt[mk]):0;
var vStr=isFinite(v)?fmt(Math.round(v))+' €':'—';
var diffStr='';
if(si>0){
var diff=v-refVal;
var dColor=diff>=0?'var(--success)':'var(--danger)';
if(mk==='debt')dColor=diff<=0?'var(--success)':'var(--danger)';
diffStr=' <span style="color:'+dColor+';font-size:10px">'+(diff>=0?'+':'')+fmt(Math.round(diff))+' €</span>';
}
lines+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px"><span style="width:8px;height:8px;border-radius:50%;background:'+s.color+';flex-shrink:0;display:inline-block"></span><span style="color:'+s.color+'">'+s.name+'</span><span style="margin-left:auto;color:var(--text-bright)">'+vStr+diffStr+'</span></div>';
});
// Detail breakdown
var detail='<div style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px;font-size:11px;color:var(--text-muted)">';
detail+='<div style="font-weight:500;margin-bottom:4px">Détail</div>';
allSeries.forEach(function(s,si){
var pt=s.pts[yi];
if(!pt){detail+='<div style="margin-bottom:2px"><span style="color:'+s.color+'">'+s.name+'</span> : —</div>';return}
var ep=isFinite(pt.ep)?fmt(Math.round(pt.ep)):'—';
var fin=isFinite(pt.fin)?fmt(Math.round(pt.fin)):'—';
var immo=isFinite(pt.immo)?fmt(Math.round(pt.immo)):'—';
var debt=isFinite(pt.debt)?fmt(Math.round(pt.debt)):'—';
detail+='<div style="margin-bottom:2px"><span style="color:'+s.color+'">'+s.name+'</span> : Ép. '+ep+' € · Fin. '+fin+' € · Immo. '+immo+' € · Dettes '+debt+' €</div>';
});
detail+='</div>';
tip.innerHTML=hdr+lines+detail;
tip.style.display='block';
// Position tooltip
var tipW=tip.offsetWidth;var tipH=tip.offsetHeight;
var px=mouseX+15;var py=e.clientY-rect.top-tipH/2;
if(px+tipW>rect.width-10)px=mouseX-tipW-15;
if(py<0)py=5;
if(py+tipH>rect.height)py=rect.height-tipH-5;
tip.style.left=px+'px';tip.style.top=py+'px';
});
zone.addEventListener('mouseleave',function(){
guide.style.display='none';tip.style.display='none';
allSeries.forEach(function(s,si){
var dot=document.getElementById('scen-dot-'+si);if(dot)dot.style.display='none';
});
});
}

// ─── Verdict ───
function renderScenVerdict(allSeries,refData){
var el=document.getElementById('scen-verdict');
if(!el)return;
if(scenariosState.length===0){el.innerHTML='';return}
var y=scenarioSliderYear;
var matelasSeuil=scenMatelasSeuil();
var msgs=[];
// Best scenario for patrimoine net
var bestName='',bestNet=-Infinity;
allSeries.forEach(function(s,si){
if(si===0)return;
var v=spf(s.pts[y]?s.pts[y].net:0);
if(v>bestNet){bestNet=v;bestName=s.name}
});
if(bestName)msgs.push('🏆 Meilleur patrimoine net à '+y+' ans : <b>'+bestName+'</b> ('+sfmt(bestNet)+' €)');
// Matelas breach
scenariosState.forEach(function(sc,si){
var ml=scenMinLiquidity(sc.data,sc.levers,sc.events,y);
if(ml.min<matelasSeuil){
msgs.push('⚠️ <span style="color:var(--danger)"><b>'+(sc.name||'S'+(si+1))+'</b> : trésorerie sous le matelas de sécurité en '+ml.date+'</span>');
}
});
// Louer/acheter bascule
allSeries.forEach(function(s){
if(s.bascule!==undefined&&s.bascule>=0){
msgs.push('🔀 Point de bascule (achat > location) : <b>année '+Math.round(s.bascule)+'</b>');
}
});
// Short vs long term
if(allSeries.length>1){
var s5=allSeries.map(function(s){return{name:s.name,v:spf(s.pts[Math.min(5,y)]?s.pts[Math.min(5,y)].net:0)}});
var sH=allSeries.map(function(s){return{name:s.name,v:spf(s.pts[y]?s.pts[y].net:0)}});
s5.sort(function(a,b){return b.v-a.v});
sH.sort(function(a,b){return b.v-a.v});
if(s5[0].name!==sH[0].name){
msgs.push('🔄 Court terme (5 ans) : <b>'+s5[0].name+'</b> devant, mais à '+y+' ans : <b>'+sH[0].name+'</b> prend l’avantage');
}
}
if(msgs.length===0){el.innerHTML='';return}
var h='<div class="card" style="padding:14px;background:rgba(200,149,108,0.06);border:1px solid rgba(200,149,108,0.2);border-radius:8px">';
h+='<div style="font-size:13px;font-weight:600;margin-bottom:8px">🧭 Verdict</div>';
msgs.forEach(function(m){h+='<div style="font-size:12px;margin-bottom:4px">'+m+'</div>'});
h+='</div>';
el.innerHTML=h;
}

// ─── Event binding ───
function attachScenarioEvents(el){
// Add scenario
var addBtn=document.getElementById('scen-add');
if(addBtn)addBtn.onclick=function(){showTemplatePicker()};
// Collapse/expand
el.querySelectorAll('.scen-toggle').forEach(function(hdr){
hdr.onclick=function(e){
if(e.target.tagName==='INPUT')return;
var si=+hdr.dataset.si;
scenariosState[si].collapsed=!scenariosState[si].collapsed;
var body=el.querySelector('.scen-body[data-si="'+si+'"]');
if(body)body.style.display=scenariosState[si].collapsed?'none':'';
var arrow=hdr.querySelector('span:last-child');
if(arrow)arrow.style.transform='rotate('+(scenariosState[si].collapsed?'0':'180')+'deg)';
saveScenarios();
};
});
// Delete
el.querySelectorAll('.scen-del').forEach(function(btn){
btn.onclick=function(){
if(!confirm('Supprimer ce scénario ?'))return;
scenariosState.splice(+btn.dataset.si,1);
saveScenarios();renderScenarios();
};
});
// Duplicate
el.querySelectorAll('.scen-dup').forEach(function(btn){
btn.onclick=function(){
if(scenariosState.length>=4)return;
var copy=JSON.parse(JSON.stringify(scenariosState[+btn.dataset.si]));
copy.name=(copy.name||'Scénario')+' (copie)';
copy.createdAt=new Date().toISOString();
scenariosState.push(copy);
saveScenarios();renderScenarios();
};
});
// Reset
el.querySelectorAll('.scen-reset').forEach(function(btn){
btn.onclick=function(){
var si=+btn.dataset.si;
scenariosState[si].data=snapshotCurrentData();
if(scenariosState[si].template==='immo'&&scenariosState[si].params){
applyTemplate(scenariosState[si],'immo',scenariosState[si].params);
}
saveScenarios();renderScenarios();
};
});
// Name
el.querySelectorAll('.scen-name').forEach(function(inp){
inp.addEventListener('change',function(){
scenariosState[+inp.dataset.si].name=inp.value;
saveScenarios();updateScenarioVisuals();
});
});
// Levers (update on change, not re-render)
el.querySelectorAll('.scen-lever').forEach(function(inp){
inp.addEventListener('change',function(){
var si=+inp.dataset.si;
scenariosState[si].levers[inp.dataset.sl]=+inp.value;
saveScenarios();updateScenarioVisuals();
});
});
// Exclude
el.querySelectorAll('.scen-exclude').forEach(function(cb){
cb.addEventListener('change',function(){
var si=+cb.dataset.si;
var eid=cb.dataset.eid;
var excl=scenariosState[si].levers.excludeIds||[];
if(cb.checked){if(excl.indexOf(eid)<0)excl.push(eid)}
else{excl=excl.filter(function(x){return x!==eid})}
scenariosState[si].levers.excludeIds=excl;
saveScenarios();updateScenarioVisuals();
});
});
// Template params (immo)
el.querySelectorAll('.scen-tpl').forEach(function(inp){
inp.addEventListener('change',function(){
var si=+inp.dataset.si;
var key=inp.dataset.tp;
scenariosState[si].params[key]=inp.type==='number'?+inp.value:inp.value;
// Re-apply template to data
scenariosState[si].data=snapshotCurrentData();
applyTemplate(scenariosState[si],'immo',scenariosState[si].params);
saveScenarios();updateScenarioVisuals();
});
});
// Louer params
el.querySelectorAll('.scen-louer').forEach(function(inp){
inp.addEventListener('change',function(){
var si=+inp.dataset.si;
if(!scenariosState[si].louerParams)scenariosState[si].louerParams={};
scenariosState[si].louerParams[inp.dataset.lp]=inp.type==='number'?+inp.value:inp.value;
saveScenarios();updateScenarioVisuals();
});
});
// Stress params
el.querySelectorAll('.scen-stress').forEach(function(inp){
inp.addEventListener('change',function(){
var si=+inp.dataset.si;
if(!scenariosState[si].stressParams)scenariosState[si].stressParams={};
var key=inp.dataset.sp;
scenariosState[si].stressParams[key]=inp.type==='checkbox'?inp.checked:(inp.type==='number'?+inp.value:inp.value);
saveScenarios();updateScenarioVisuals();
});
});
// Pro params
el.querySelectorAll('.scen-pro').forEach(function(inp){
inp.addEventListener('change',function(){
var si=+inp.dataset.si;
if(!scenariosState[si].proParams)scenariosState[si].proParams={};
scenariosState[si].proParams[inp.dataset.pp]=inp.type==='number'?+inp.value:inp.value;
saveScenarios();updateScenarioVisuals();
});
});
// Event add
el.querySelectorAll('.scen-ev-add').forEach(function(btn){
btn.onclick=function(){
var si=+btn.dataset.si;
if(!scenariosState[si].events)scenariosState[si].events=[];
scenariosState[si].events.push({type:'monthly_expense',amount:0,dateStart:'',dateEnd:''});
saveScenarios();renderScenarios();
};
});
// Event delete
el.querySelectorAll('.scen-ev-del').forEach(function(btn){
btn.onclick=function(){
var si=+btn.dataset.si,ei=+btn.dataset.ei;
scenariosState[si].events.splice(ei,1);
saveScenarios();renderScenarios();
};
});
// Event type change
el.querySelectorAll('.scen-ev-type').forEach(function(sel){
sel.addEventListener('change',function(){
var si=+sel.dataset.si,ei=+sel.dataset.ei;
scenariosState[si].events[ei].type=sel.value;
saveScenarios();renderScenarios();
});
});
// Event value change
el.querySelectorAll('.scen-ev-val').forEach(function(inp){
inp.addEventListener('change',function(){
var si=+inp.dataset.si,ei=+inp.dataset.ei;
scenariosState[si].events[ei].amount=+inp.value;
saveScenarios();updateScenarioVisuals();
});
});
// Event dates change
el.querySelectorAll('.scen-ev-ds').forEach(function(inp){
inp.addEventListener('change',function(){
var si=+inp.dataset.si,ei=+inp.dataset.ei;
scenariosState[si].events[ei].dateStart=inp.value;
scenariosState[si].events[ei].date=inp.value;
saveScenarios();updateScenarioVisuals();
});
});
el.querySelectorAll('.scen-ev-de').forEach(function(inp){
inp.addEventListener('change',function(){
var si=+inp.dataset.si,ei=+inp.dataset.ei;
scenariosState[si].events[ei].dateEnd=inp.value;
saveScenarios();updateScenarioVisuals();
});
});
// Metric pills
el.querySelectorAll('.scen-metric-btn').forEach(function(btn){
btn.onclick=function(){
scenMetric=btn.dataset.sm;
el.querySelectorAll('.scen-metric-btn').forEach(function(b){b.classList.toggle('active',b.dataset.sm===scenMetric)});
updateScenarioVisuals();
};
});
// Slider
var sl=el.querySelector('#scen-slider');
if(sl){
sl.addEventListener('input',function(){
scenarioSliderYear=+sl.value;
var lbl=el.querySelector('#scen-slider-lbl');
if(lbl)lbl.textContent=scenarioSliderYear===0?"Aujourd\x27hui":scenarioSliderYear+' ans';
sl.style.setProperty('--filled',(scenarioSliderYear/40*100)+'%');
updateScenarioVisuals();
});
initSliderFloat(sl);
}
}

</script>
<script>
(function(){try{var ch=false;function fx(acc){(acc.operations||[]).forEach(function(op){if(op.autoManaged&&op.type==='retrait'){op.type='Retrait partiel';op.name=op.name||'Apport pour un investissement';op.amount=String(Math.round(parseFloat(op.amount)||0));op.recurrence='Ponctuel';op.linkedTo='';delete op.label;ch=true}})}epargneState.forEach(fx);investState.financier.forEach(fx);if(ch){saveEpargne();saveInvest();if(typeof renderAll==='function')renderAll()}}catch(e){}})();
</script>
